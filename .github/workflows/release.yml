name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-apk
            os: ubuntu-latest
            build_command: flutter build apk --release
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            artifact_name: aeterna-android-apk
          - target: web
            os: ubuntu-latest
            build_command: flutter build web --release
            artifact_path: build/web
            artifact_name: aeterna-web
          - target: linux
            os: ubuntu-latest
            build_command: flutter build linux --release
            artifact_path: build/linux/x64/release/bundle
            artifact_name: aeterna-linux
          - target: windows
            os: windows-latest
            build_command: flutter build windows --release
            artifact_path: build/windows/x64/runner/Release
            artifact_name: aeterna-windows
          - target: macos
            os: macos-latest
            build_command: flutter build macos --release
            artifact_path: build/macos/Build/Products/Release
            artifact_name: aeterna-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java (Android)
        if: matrix.target == 'android-apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build
        run: ${{ matrix.build_command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Archive artifacts
        run: |
          cd artifacts
          for d in */ ; do
            dir="${d%/}"
            zip -r "${dir}.zip" "$dir"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
