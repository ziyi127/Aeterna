name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - target: android-apk
            os: ubuntu-latest
            optional: false
            build_command: flutter build apk --release --no-pub
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            artifact_name: aeterna-android-apk
          - target: web
            os: ubuntu-latest
            optional: false
            build_command: flutter build web --release --no-pub --base-href "/${{ github.event.repository.name }}/"
            artifact_path: build/web
            artifact_name: aeterna-web
          - target: linux
            os: ubuntu-latest
            optional: false
            build_command: flutter build linux --release --no-pub
            artifact_path: build/linux/x64/release/bundle
            artifact_name: aeterna-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            optional: true
            build_command: flutter build linux --release --no-pub --target-platform=linux-arm64
            artifact_path: build/linux/**/release/bundle
            artifact_name: aeterna-linux-arm64
          - target: windows
            os: windows-latest
            optional: false
            build_command: flutter build windows --release --no-pub
            artifact_path: build/windows/x64/runner/Release
            artifact_name: aeterna-windows-x64
          - target: windows-arm64
            os: windows-latest
            optional: true
            build_command: flutter build windows --release --no-pub --target-platform=windows-arm64
            artifact_path: build/windows/**/runner/Release
            artifact_name: aeterna-windows-arm64
          - target: macos
            os: macos-latest
            optional: false
            build_command: flutter build macos --release --no-pub
            artifact_path: build/macos/Build/Products/Release/aeterna.app
            artifact_name: aeterna-macos-arm64
          - target: macos-x64
            os: macos-latest
            optional: true
            build_command: |
              flutter build macos --release --config-only --no-pub
              xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -derivedDataPath build/macos_x64 -arch x86_64
            artifact_path: build/macos_x64/Build/Products/Release/aeterna.app
            artifact_name: aeterna-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java (Android)
        if: matrix.target == 'android-apk'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Linux build dependencies (required)
        if: startsWith(matrix.target, 'linux') && matrix.optional != true
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake pkg-config

      - name: Install Linux build dependencies (optional)
        if: startsWith(matrix.target, 'linux') && matrix.optional == true
        shell: bash
        run: |
          set +e
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake pkg-config
          code=$?
          if [ "$code" -ne 0 ]; then
            mkdir -p .ci/status
            echo "Optional target ${{ matrix.target }} dependency install failed with exit code $code." > .ci/status/${{ matrix.target }}.txt
            echo "::warning::Optional target ${{ matrix.target }} dependency install failed with exit code $code."
          fi
          exit 0

      - name: Setup Flutter (standard)
        if: matrix.target != 'linux-arm64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Flutter (linux-arm64 fallback)
        if: matrix.target == 'linux-arm64'
        shell: bash
        run: |
          set -e
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --enable-linux-desktop
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build (required targets)
        if: matrix.optional != true
        run: ${{ matrix.build_command }}

      - name: Build (optional targets on non-Windows)
        if: matrix.optional == true && !startsWith(matrix.target, 'windows') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set +e
          ${{ matrix.build_command }}
          code=$?
          if [ "$code" -ne 0 ]; then
            mkdir -p .ci/status
            echo "Optional target ${{ matrix.target }} build failed with exit code $code." > .ci/status/${{ matrix.target }}.txt
            echo "::warning::Optional target ${{ matrix.target }} build failed with exit code $code."
          fi
          exit 0

      - name: Build (optional targets on Windows)
        if: matrix.optional == true && startsWith(matrix.target, 'windows') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          if ('${{ matrix.target }}' -eq 'windows-arm64') {
            $help = flutter build windows -h
            if (-not ($help -match 'windows-arm64')) {
              New-Item -ItemType Directory -Force -Path .ci/status | Out-Null
              'Optional target windows-arm64 skipped: current Flutter toolchain does not support windows-arm64.' | Out-File -FilePath '.ci/status/windows-arm64.txt' -Encoding utf8
              Write-Host 'windows-arm64 not supported by current Flutter version. Skip optional build.'
              exit 0
            }
          }
          $LASTEXITCODE = 0
          Invoke-Expression "${{ matrix.build_command }}"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            New-Item -ItemType Directory -Force -Path .ci/status | Out-Null
            $message = "Optional target ${{ matrix.target }} build failed with exit code $code."
            $message | Out-File -FilePath ".ci/status/${{ matrix.target }}.txt" -Encoding utf8
            Write-Host "::warning::$message"
          }
          exit 0

      - name: Upload artifact
        if: matrix.optional != true
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload optional artifact
        if: matrix.optional == true && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload optional build report
        if: matrix.optional == true && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-report
          path: .ci/status/${{ matrix.target }}.txt
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Archive artifacts
        run: |
          cd artifacts
          for d in */ ; do
            dir="${d%/}"
            if [[ "$dir" == *-report ]]; then
              echo "Skip report artifact: $dir"
              continue
            fi
            zip -qr -1 "${dir}.zip" "$dir"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
