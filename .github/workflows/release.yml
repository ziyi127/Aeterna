name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Qt build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-declarative-dev qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qt-labs-platform libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy (complete build)
        run: cargo clippy --locked --all-targets -- -D warnings -A dead_code -A unused -A clippy::useless_transmute
      - name: Clippy (minimal build)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings -A dead_code -A unused -A clippy::useless_transmute
      - name: Test complete build
        run: cargo test --locked
      - name: Test minimal build
        run: cargo test --locked --no-default-features

  verify-release-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag and package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          test -n "$package_version"
          test "$tag_version" = "$package_version"

  linux-x86_64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, verify-release-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Qt runtime and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qt-labs-platform libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build complete release
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu
      - name: Stage portable and bare archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PORTABLE="dist/aeterna-${VERSION}-linux-x86_64-portable"
          BARE="dist/aeterna-${VERSION}-linux-x86_64-bare"
          BIN="target/x86_64-unknown-linux-gnu/release/aeterna"
          QT_LIB="/usr/lib/x86_64-linux-gnu"
          QT_QML="/usr/lib/x86_64-linux-gnu/qt6/qml"
          QT_PLUGINS="/usr/lib/x86_64-linux-gnu/qt6/plugins"
          rm -rf dist
          install -Dm755 "$BIN" "$PORTABLE/bin/aeterna"
          install -Dm644 LICENSE "$PORTABLE/LICENSE"
          install -Dm644 THIRD-PARTY-NOTICES.txt "$PORTABLE/THIRD-PARTY-NOTICES.txt"
          install -Dm644 packaging/runtime/README-portable.txt "$PORTABLE/README.txt"
          install -Dm755 "$BIN" "$BARE/aeterna"
          install -Dm644 LICENSE "$BARE/LICENSE"
          install -Dm644 THIRD-PARTY-NOTICES.txt "$BARE/THIRD-PARTY-NOTICES.txt"
          install -Dm644 packaging/runtime/README-bare.txt "$BARE/README.txt"
          test "$(find "$BARE" -type f | wc -l)" -eq 4
          mkdir -p "$PORTABLE/lib" "$PORTABLE/plugins" "$PORTABLE/qml/Qt/labs"

          # The application QML is embedded in the binary. Copy only the Qt
          # modules imported by that embedded QML, not the complete Qt QML tree.
          QML_SCANNER="$(command -v qmlimportscanner || find /usr/lib/qt6 /usr/lib -type f -name qmlimportscanner -print -quit)"
          test -n "$QML_SCANNER"
          "$QML_SCANNER" -rootPath resources/qml -importPath "$QT_QML" > qml-imports.json
          jq -e 'length > 0' qml-imports.json >/dev/null
          copy_qml_module() {
            local module="$1"
            local source="$QT_QML/${module//./\/}"
            local destination="$PORTABLE/qml/${module//./\/}"
            test -d "$source" || { echo "Missing QML module: $module" >&2; exit 1; }
            mkdir -p "$destination"
            find "$source" -maxdepth 1 -type f \( -name 'qmldir' -o -name '*.so' -o -name '*.qml' -o -name '*.qmltypes' \) -exec cp -a {} "$destination/" \;
          }
          # `import "."` resolves local QML embedded through resources.qrc; it is
          # not a deployable Qt module. Keep the allowlist strict for named imports.
          jq -r '.[] | select(.name != ".") | .name' qml-imports.json | sort -u > qml-imports.used
          while IFS= read -r module; do
            case "$module" in
              # Qt's generic Controls qmldir advertises these unavailable non-Linux
              # styles as optional auto-imports. They are not application imports.
              QtQuick.Controls.Windows|QtQuick.Controls.macOS|QtQuick.Controls.iOS) ;;
              QtQuick|QtQuick.*|QtQml|QtQml.*|Qt.labs|Qt.labs.*) copy_qml_module "$module" ;;
              Aeterna) ;;
              *) echo "Unexpected QML import: $module" >&2; exit 1 ;;
            esac
          done < qml-imports.used
          grep -Eq '^(QtQuick|QtQuick\.|QtQml|QtQml\.|Qt\.labs\.)' qml-imports.used

          # Start with the desktop platform plugin. Add Qt libraries only when
          # they are referenced by the executable or deployed Qt plugins.
          mkdir -p "$PORTABLE/plugins/platforms"
          cp -a "$QT_PLUGINS/platforms/libqxcb.so" "$PORTABLE/plugins/platforms/"
          copy_qt_dependencies() {
            local scan_file="$1"
            while read -r dependency; do
              case "$(basename "$dependency")" in
                libQt6*.so*)
                  local library="$(basename "$dependency")"
                  if [ ! -e "$PORTABLE/lib/$library" ]; then
                    cp -aL "$dependency" "$PORTABLE/lib/$library"
                    copy_qt_dependencies "$dependency"
                  fi
                  ;;
              esac
            done < <(ldd "$scan_file" | awk '$3 ~ /^\\// {print $3}')
          }
          copy_qt_dependencies "$PORTABLE/bin/aeterna"
          while IFS= read -r plugin; do
            copy_qt_dependencies "$plugin"
          done < <(find "$PORTABLE/qml" "$PORTABLE/plugins" -type f -name '*.so')
          test -n "$(find "$PORTABLE/lib" -type f -name 'libQt6*.so*' -print -quit)"

          printf '%s\n' '[Paths]' 'Prefix=..' 'Libraries=lib' 'Plugins=plugins' 'Qml2Imports=qml' > "$PORTABLE/bin/qt.conf"
          ! find "$PORTABLE" -type f \( -name 'qmake*' -o -name '*.cmake' -o -name '*.h' -o -name '*.pdb' \) | grep -q .
          ! grep -R "$QT_LIB\|/opt/qt\|/home/runner" "$PORTABLE" >/dev/null 2>&1
          tar -C dist -czf "dist/aeterna-${VERSION}-linux-x86_64-portable.tar.gz" "$(basename "$PORTABLE")"
          tar -C dist -czf "dist/aeterna-${VERSION}-linux-x86_64-bare.tar.gz" "$(basename "$BARE")"
          tar -tzf "dist/aeterna-${VERSION}-linux-x86_64-portable.tar.gz" >/dev/null
          readelf -d "$PORTABLE/bin/aeterna" | grep -q 'ORIGIN/../lib'
          ! find "$BARE" -type f \( -name 'libQt6*' -o -name '*.so*' -o -name 'qt.conf' \) | grep -q .
          du -sh "$PORTABLE" "$BARE"
          sha256sum dist/*.tar.gz > "dist/aeterna-${VERSION}-linux-x86_64.SHA256"
      - uses: actions/upload-artifact@v6
        with:
          name: aeterna-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.SHA256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  windows-x86_64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, verify-release-version]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Qt 6
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0"
          aqt --version
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O D:\a\Qt
          $qt = 'D:\a\Qt\6.8.3\msvc2022_64'
          "QT_PREFIX=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QMAKE=$qt\bin\qmake.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qt\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          $requiredPaths = @(
            "$qt\bin\qmake.exe",
            "$qt\bin\windeployqt.exe",
            "$qt\qml\QtQuick\qmldir",
            "$qt\qml\QtQuick\Controls\qmldir",
            "$qt\qml\QtQuick\Layouts\qmldir",
            "$qt\qml\QtQuick\Window\qmldir",
            "$qt\qml\Qt\labs\platform\qmldir"
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path $path)) { throw "Required Qt component is missing: $path" }
          }
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $qt = $env:QT_PREFIX
          $exe = 'target\x86_64-pc-windows-msvc\release\aeterna.exe'
          $portable = "dist\aeterna-$version-windows-x86_64-portable"
          $bare = "dist\aeterna-$version-windows-x86_64-bare"
          cargo build --locked --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force $portable, $bare | Out-Null
          Copy-Item $exe "$portable\aeterna.exe"
          Copy-Item $exe "$bare\aeterna.exe"
          Copy-Item LICENSE "$portable\LICENSE"; Copy-Item LICENSE "$bare\LICENSE"
          Copy-Item THIRD-PARTY-NOTICES.txt "$portable\THIRD-PARTY-NOTICES.txt"; Copy-Item THIRD-PARTY-NOTICES.txt "$bare\THIRD-PARTY-NOTICES.txt"
          Copy-Item packaging\runtime\README-portable.txt "$portable\README.txt"
          Copy-Item packaging\runtime\README-bare.txt "$bare\README.txt"
          & "$qt\bin\windeployqt.exe" --release --qmldir resources\qml --no-translations --no-compiler-runtime "$portable\aeterna.exe"
          if (-not (Test-Path "$portable\Qt6Core.dll")) { throw 'Qt runtime was not deployed' }
          if (-not (Test-Path "$portable\platforms\qwindows.dll")) { throw 'Windows platform plugin was not deployed' }
          $requiredQmlModules = @(
            "$portable\qml\QtQuick\qmldir",
            "$portable\qml\QtQuick\Controls\qmldir",
            "$portable\qml\QtQuick\Layouts\qmldir",
            "$portable\qml\QtQuick\Window\qmldir",
            "$portable\qml\Qt\labs\platform\qmldir"
          )
          foreach ($path in $requiredQmlModules) {
            if (-not (Test-Path $path)) { throw "Required QML module was not deployed: $path" }
          }
          $forbidden = Get-ChildItem $portable -Recurse -File | Where-Object {
            $_.Name -match '^(qmake|qmlcachegen|qmlimportscanner)(\.exe)?$' -or
            $_.Extension -in '.pdb', '.cmake', '.h'
          }
          if ($forbidden) { throw "Qt development files leaked into portable package: $($forbidden.FullName -join ', ')" }
          if (Get-ChildItem $bare -Recurse -File | Where-Object { $_.Name -match '^(Qt6.*\.dll|qwindows\.dll)$' }) {
            throw 'Bare package contains Qt runtime files'
          }
          if ((Get-ChildItem $bare -Recurse -File).Count -ne 4) { throw 'Bare package must contain only executable, license, third-party notices, and README' }
          Write-Host "Portable files: $((Get-ChildItem $portable -Recurse -File).Count); bare files: $((Get-ChildItem $bare -Recurse -File).Count)"
          Compress-Archive -Path $portable -DestinationPath "dist\aeterna-$version-windows-x86_64-portable.zip"
          Compress-Archive -Path $bare -DestinationPath "dist\aeterna-$version-windows-x86_64-bare.zip"
          Get-ChildItem 'dist\*.zip' | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii "dist\aeterna-$version-windows-x86_64.SHA256"
      - uses: actions/upload-artifact@v6
        with:
          name: aeterna-windows-x86_64
          path: |
            dist/*.zip
            dist/*.SHA256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, verify-release-version]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Qt 6
        shell: bash
        run: |
          brew install qt@6
          QT_PREFIX="$(brew --prefix qt@6)"
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "QMAKE=$QT_PREFIX/bin/qmake" >> "$GITHUB_ENV"
          echo "$QT_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="dist/aeterna.app"
          BARE="dist/aeterna-${VERSION}-macos-arm64-bare"
          cargo build --locked --release --target aarch64-apple-darwin
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$BARE"
          install -m755 target/aarch64-apple-darwin/release/aeterna "$APP/Contents/MacOS/aeterna"
          sed "s/@VERSION@/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          install -m644 LICENSE "$APP/Contents/Resources/LICENSE"
          install -m644 THIRD-PARTY-NOTICES.txt "$APP/Contents/Resources/THIRD-PARTY-NOTICES.txt"
          install -m644 packaging/runtime/README-portable.txt "$APP/Contents/Resources/README.txt"
          "$QT_PREFIX/bin/macdeployqt" "$APP" -qmldir=resources/qml -always-overwrite
          install -m755 target/aarch64-apple-darwin/release/aeterna "$BARE/aeterna"
          install -m644 LICENSE "$BARE/LICENSE"
          install -m644 THIRD-PARTY-NOTICES.txt "$BARE/THIRD-PARTY-NOTICES.txt"
          install -m644 packaging/runtime/README-bare.txt "$BARE/README.txt"
          test "$(find "$BARE" -type f | wc -l)" -eq 4
          test -f "$APP/Contents/PlugIns/platforms/libqcocoa.dylib"
          test -d "$APP/Contents/Resources/qml/QtQuick"
          ! find "$APP" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 | xargs -0 -r otool -L | grep -E '/opt/homebrew/|/usr/local/Cellar/|/Users/.*/Qt/'
          ! find "$APP" -type f \( -name 'qmake' -o -name 'qmlimportscanner' -o -name '*.cmake' -o -name '*.h' -o -name '*.pdb' \) | grep -q .
          test "$(find "$BARE" -type f | wc -l)" -eq 4
          du -sh "$APP" "$BARE"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/aeterna-${VERSION}-macos-arm64-portable.zip"
          tar -C dist -czf "dist/aeterna-${VERSION}-macos-arm64-bare.tar.gz" "$(basename "$BARE")"
          ! otool -L "$APP/Contents/MacOS/aeterna" | grep -q '/opt/homebrew/Cellar'
          shasum -a 256 dist/*.zip dist/*.tar.gz > "dist/aeterna-${VERSION}-macos-arm64.SHA256"
      - uses: actions/upload-artifact@v6
        with:
          name: aeterna-macos-arm64
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.SHA256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, verify-release-version, linux-x86_64, windows-x86_64, macos-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: aeterna-*
          path: artifacts
          merge-multiple: true
      - name: Generate release notes and combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat > ../release-notes.md <<'EOF'
          ## Aeterna ${{ github.ref_name }}

          Portable archives contain only the Qt runtime components discovered from Aeterna's ELF/PE/Mach-O and QML dependencies; they do not contain the Qt SDK.
          Bare archives contain only Aeterna and require an ABI-compatible Qt 6 runtime.

          Linux portable is a dependency-pruned Qt bundle rather than an AppImage and still uses compatible host graphics and system libraries.
          macOS portable is unsigned and not notarized.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aeterna ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.SHA256
            artifacts/SHA256SUMS.txt
