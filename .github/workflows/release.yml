name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - target: android-apk
            os: ubuntu-latest
            optional: false
            build_command: flutter build apk --release --tree-shake-icons --split-per-abi --obfuscate --split-debug-info=build/symbols/android
            artifact_path: build/app/outputs/flutter-apk/*.apk
            artifact_name: aeterna-android-apk
          - target: web
            os: ubuntu-latest
            optional: false
            build_command: flutter build web --release --tree-shake-icons --base-href "/${{ github.event.repository.name }}/"
            artifact_path: build/web
            artifact_name: aeterna-web
          - target: linux
            os: ubuntu-latest
            optional: false
            build_command: flutter build linux --release --tree-shake-icons --obfuscate --split-debug-info=build/symbols/linux
            artifact_path: build/linux/x64/release/bundle
            artifact_name: aeterna-linux-x64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            optional: true
            build_command: flutter build linux --release --tree-shake-icons --target-platform=linux-arm64 --obfuscate --split-debug-info=build/symbols/linux-arm64
            artifact_path: build/linux/**/release/bundle
            artifact_name: aeterna-linux-arm64
          - target: windows
            os: windows-latest
            optional: false
            build_command: flutter build windows --release --tree-shake-icons --obfuscate --split-debug-info=build/symbols/windows
            artifact_path: build/windows/squirrel/Releases
            artifact_name: aeterna-windows-squirrel-feed
          - target: windows-arm64
            os: windows-latest
            optional: true
            build_command: flutter build windows --release --tree-shake-icons --target-platform=windows-arm64 --obfuscate --split-debug-info=build/symbols/windows-arm64
            artifact_path: build/windows/**/runner/Release
            artifact_name: aeterna-windows-arm64
          - target: macos
            os: macos-latest
            optional: false
            build_command: flutter build macos --release --tree-shake-icons --obfuscate --split-debug-info=build/symbols/macos
            artifact_path: build/macos/Build/Products/Release/aeterna.app
            artifact_name: aeterna-macos-arm64
          - target: macos-x64
            os: macos-latest
            optional: true
            build_command: |
              flutter build macos --release --config-only
              xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -derivedDataPath build/macos_x64 -arch x86_64
            artifact_path: build/macos_x64/Build/Products/Release/aeterna.app
            artifact_name: aeterna-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java (Android)
        if: matrix.target == 'android-apk'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Linux build dependencies (required)
        if: startsWith(matrix.target, 'linux') && matrix.optional != true
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake pkg-config

      - name: Install Linux build dependencies (optional)
        if: startsWith(matrix.target, 'linux') && matrix.optional == true
        shell: bash
        run: |
          set +e
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake pkg-config
          code=$?
          if [ "$code" -ne 0 ]; then
            mkdir -p .ci/status
            echo "Optional target ${{ matrix.target }} dependency install failed with exit code $code." > .ci/status/${{ matrix.target }}.txt
            echo "::warning::Optional target ${{ matrix.target }} dependency install failed with exit code $code."
          fi
          exit 0

      - name: Setup Flutter (standard)
        if: matrix.target != 'linux-arm64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Flutter (linux-arm64 fallback)
        if: matrix.target == 'linux-arm64'
        shell: bash
        run: |
          set -e
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --enable-linux-desktop
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build (required targets)
        if: matrix.optional != true
        run: ${{ matrix.build_command }}

      - name: Build (optional targets on non-Windows)
        if: matrix.optional == true && !startsWith(matrix.target, 'windows') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set +e
          ${{ matrix.build_command }}
          code=$?
          if [ "$code" -ne 0 ]; then
            mkdir -p .ci/status
            echo "Optional target ${{ matrix.target }} build failed with exit code $code." > .ci/status/${{ matrix.target }}.txt
            echo "::warning::Optional target ${{ matrix.target }} build failed with exit code $code."
          fi
          exit 0

      - name: Build (optional targets on Windows)
        if: matrix.optional == true && startsWith(matrix.target, 'windows') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          if ('${{ matrix.target }}' -eq 'windows-arm64') {
            $help = flutter build windows -h
            if (-not ($help -match 'windows-arm64')) {
              New-Item -ItemType Directory -Force -Path .ci/status | Out-Null
              'Optional target windows-arm64 skipped: current Flutter toolchain does not support windows-arm64.' | Out-File -FilePath '.ci/status/windows-arm64.txt' -Encoding utf8
              Write-Host 'windows-arm64 not supported by current Flutter version. Skip optional build.'
              exit 0
            }
          }
          $LASTEXITCODE = 0
          Invoke-Expression "${{ matrix.build_command }}"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            New-Item -ItemType Directory -Force -Path .ci/status | Out-Null
            $message = "Optional target ${{ matrix.target }} build failed with exit code $code."
            $message | Out-File -FilePath ".ci/status/${{ matrix.target }}.txt" -Encoding utf8
            Write-Host "::warning::$message"
          }
          exit 0

      - name: Strip Linux binaries
        if: startsWith(matrix.target, 'linux')
        shell: bash
        run: |
          set +e
          find build/linux -type f \( -name 'aeterna' -o -name '*.so' \) -exec strip --strip-unneeded {} +
          exit 0

      - name: Strip macOS binaries
        if: startsWith(matrix.target, 'macos')
        shell: bash
        run: |
          set +e
          find build -type f -path "*.app/Contents/MacOS/*" -exec strip -x {} +
          find build -type f -path "*.app/Contents/Frameworks/*.framework/*" -exec strip -x {} +
          exit 0

      - name: Trim Windows debug symbols
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          $path = '${{ matrix.artifact_path }}'
          if (Test-Path $path) {
            Get-ChildItem -Path $path -Recurse -Include *.pdb,*.lib,*.exp -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

      - name: Package Windows with Squirrel
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Resolve-Path 'build/windows/x64/runner/Release'
          $packageRoot = 'build/windows/squirrel'
          $packagesDir = Join-Path $packageRoot 'packages'
          $releasesDir = Join-Path $packageRoot 'Releases'
          New-Item -ItemType Directory -Force -Path $packagesDir, $releasesDir | Out-Null

          $versionLine = Get-Content 'pubspec.yaml' | Where-Object { $_ -match '^version:\s*' } | Select-Object -First 1
          if (-not $versionLine) {
            throw 'Unable to determine application version from pubspec.yaml.'
          }
          $version = ($versionLine -replace '^version:\s*', '').Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Unsupported version format: $version"
          }
          $nugetVersion = $version.Split('+')[0]

          nuget install Squirrel.Windows -Version 2.0.1 -OutputDirectory $packageRoot | Out-Null
          $squirrelExe = Get-ChildItem -Path $packageRoot -Recurse -Filter squirrel.exe | Select-Object -First 1
          if (-not $squirrelExe) {
            throw 'Unable to locate squirrel.exe after installing Squirrel.Windows.'
          }

          $nuspec = 'tools/windows/aeterna-squirrel.nuspec'
          $nupkgOutput = Join-Path $packagesDir "Aeterna.$nugetVersion.nupkg"
          nuget pack $nuspec -Version $nugetVersion -BasePath $releaseDir -OutputDirectory $packagesDir | Out-Null
          if (-not (Test-Path $nupkgOutput)) {
            throw "NuGet package was not created: $nupkgOutput"
          }

          & $squirrelExe.FullName --releasify $nupkgOutput --releaseDir $releasesDir | Out-Null
          if (-not (Test-Path (Join-Path $releasesDir 'Setup.exe'))) {
            throw 'Squirrel releasify did not generate Setup.exe.'
          }

          Remove-Item -Recurse -Force $packagesDir -ErrorAction SilentlyContinue
          Remove-Item -Force $nupkgOutput -ErrorAction SilentlyContinue

      - name: Upload artifact
        if: matrix.optional != true
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          compression-level: 9
          if-no-files-found: error

      - name: Upload optional artifact
        if: matrix.optional == true && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          compression-level: 9
          if-no-files-found: ignore

      - name: Upload optional build report
        if: matrix.optional == true && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-report
          path: .ci/status/${{ matrix.target }}.txt
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip zstd

      - name: Archive artifacts
        run: |
          cd artifacts
          for d in */ ; do
            dir="${d%/}"
            if [[ "$dir" == *-report ]]; then
              echo "Skip report artifact: $dir"
              continue
            fi
            if [[ "$dir" == "aeterna-windows-squirrel-feed" ]]; then
              tar --zstd -cf "${dir}.tar.zst" -C "$dir" .
              continue
            fi
            zip -r -9 "${dir}.zip" "$dir"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
