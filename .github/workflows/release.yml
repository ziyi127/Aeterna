name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════
  # Quality gates — fmt + clippy + test (Linux)
  # ═══════════════════════════════════════════════
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-declarative-dev \
            libgl1-mesa-dev libxkbcommon-dev \
            libfontconfig1-dev librsvg2-bin

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings -A dead_code -A unused -A clippy::useless_transmute

      - name: Test
        run: cargo test --release

  verify-release-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag and package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          test -n "$package_version"
          test "$tag_version" = "$package_version"

  # ═══════════════════════════════════════════════
  # Linux x86_64 — stripped binary (no Qt bundle)
  # ═══════════════════════════════════════════════
  linux-x86_64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-declarative-dev libqt6sql6-mysql \
            libgl1-mesa-dev libxkbcommon-dev \
            libfontconfig1-dev librsvg2-bin

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build (release)
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Strip & rename
        run: |
          strip target/x86_64-unknown-linux-gnu/release/aeterna
          cp target/x86_64-unknown-linux-gnu/release/aeterna aeterna-x86_64-linux
          sha256sum aeterna-x86_64-linux > aeterna-x86_64-linux.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: aeterna-x86_64-linux
          path: |
            aeterna-x86_64-linux
            aeterna-x86_64-linux.sha256

  # ═══════════════════════════════════════════════
  # Windows x86_64 — stripped binary (no Qt bundle)
  # ═══════════════════════════════════════════════
  windows-x86_64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6 (via aqt)
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O D:\a\Qt
          echo "Qt6_DIR=D:\a\Qt\6.8.3\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "D:\a\Qt\6.8.3\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc
        shell: pwsh
        env:
          Qt6_DIR: D:\a\Qt\6.8.3\msvc2022_64

      - name: Strip & rename
        run: |
          strip target\x86_64-pc-windows-msvc\release\aeterna.exe
          Move-Item target\x86_64-pc-windows-msvc\release\aeterna.exe aeterna.exe
          Get-FileHash -Algorithm SHA256 aeterna.exe | ForEach-Object { "$($_.Hash.ToLower())  aeterna.exe" } | Out-File aeterna-x86_64-windows.sha256 -Encoding ascii
        shell: pwsh

      - uses: actions/upload-artifact@v6
        with:
          name: aeterna-x86_64-windows
          path: |
            aeterna.exe
            aeterna-x86_64-windows.sha256

  # ═══════════════════════════════════════════════
  # macOS Apple Silicon (arm64) — stripped binary
  # ═══════════════════════════════════════════════
  macos-arm64:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew update > /dev/null 2>&1
          brew install qt@6
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build (release)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Strip & rename
        run: |
          strip target/aarch64-apple-darwin/release/aeterna
          cp target/aarch64-apple-darwin/release/aeterna aeterna-arm64-macos
          shasum -a 256 aeterna-arm64-macos > aeterna-arm64-macos.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: aeterna-arm64-macos
          path: |
            aeterna-arm64-macos
            aeterna-arm64-macos.sha256

  # ═══════════════════════════════════════════════
  # Create GitHub Release (only on tag push)
  # ═══════════════════════════════════════════════
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - quality
      - verify-release-version
      - linux-x86_64
      - windows-x86_64
      - macos-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          cat > release-notes.md << 'EOF'
          ## Aeterna ${{ github.ref_name }}

          ### 📦 Downloads

          | Platform | File |
          |----------|------|
          | Linux x86_64 | `aeterna-x86_64-linux` |
          | Windows x86_64 | `aeterna.exe` |
          | macOS Apple Silicon | `aeterna-arm64-macos` |

          > 本版本仅提供可执行文件，运行时需安装 Qt 6.5+。
          > 运行方式：`./aeterna` (Linux/macOS)、双击 `aeterna.exe` (Windows)。
          EOF

          find artifacts -type f -name '*.sha256' -delete

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aeterna ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: artifacts/**/*
