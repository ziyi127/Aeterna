[package]
name = "aeterna"
version = "2.0.0"
edition = "2021"
description = "Aeterna - Exam Schedule Player / Timer System"
authors = ["ziyi127"]
license = "GPL-3.0-only"
repository = "https://github.com/ziyi127/Aeterna"

[[bin]]
name = "aeterna"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
qmetaobject = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
actix-web = "4"
actix-ws = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
mdns-sd = "0.11"
log = "0.4"
env_logger = "0.11"
dirs = "5"
actix-cors = "0.7"
libc = "0.2"

[build-dependencies]
qmetaobject = "0.2"

[lints.rust]
unused = "warn"
