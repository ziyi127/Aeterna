[package]
name = "aeterna"
version = "2.0.17"
edition = "2021"
description = "Aeterna - Exam Schedule Player / Timer System"
authors = ["ziyi127"]
license = "GPL-3.0-only"
repository = "https://github.com/ziyi127/Aeterna"

[[bin]]
name = "aeterna"
path = "src/main.rs"

[features]
# The normal application distribution includes casting. `--no-default-features`
# builds the explicitly minimal variant for constrained environments.
default = ["cast"]
cast = ["dep:reqwest", "dep:mdns-sd", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
qmetaobject = "0.2"
log = { version = "0.4", features = ["std"] }
dirs = "5"
fs4 = "0.13"
libc = "0.2"

# Cast support (optional — disabled by default, enabled via `cast` feature)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
mdns-sd = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"], optional = true }

[build-dependencies]
qmetaobject = "0.2"

[profile.release]
opt-level = "z"     # optimize for size (vs "s" or "3")
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
codegen-units = 16
incremental = true

[lints.rust]
unused = "warn"
